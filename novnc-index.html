<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camoufox VNC</title>
  <!-- Fallback sem JS: entra direto com autoconnect -->
  <meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&amp;reconnect=true&amp;reconnect_delay=2000&amp;resize=scale">
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      // Força entrada direta sem clique no "Conectar",
      // mas respeita parâmetros explícitos se o utilizador os passar.
      if (!params.has('autoconnect')) params.set('autoconnect', 'true');
      if (!params.has('reconnect')) params.set('reconnect', 'true');
      if (!params.has('reconnect_delay')) params.set('reconnect_delay', '2000');
      if (!params.has('resize')) params.set('resize', 'scale');
      var target = 'vnc.html?' + params.toString() + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    body { background: #1a1a1a; color: #ccc; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; }
  </style>
</head>
<body>
  <p>A ligar ao Camoufox… <a href="vnc.html?autoconnect=true&reconnect=true&reconnect_delay=2000&resize=scale">clica aqui se não fores redirecionado</a>.</p>
</body>
</html>
