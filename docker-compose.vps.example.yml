# ============================================================
#  Camoufox VNC - Production / VPS Docker Compose
#  Use this file to run Camoufox on a VPS
# ============================================================
#
#  How to use on the VPS:
#    1. Create a folder on the VPS: mkdir -p ~/camoufox && cd ~/camoufox
#    2. Copy this file as docker-compose.yml
#    3. Start the service (public image, no login required):
#       docker compose up -d
#    4. Open in your browser: http://YOUR_VPS_IP:5800
# ============================================================

services:
  camoufox:
    image: xorao/camoufox-vnc:latest
    container_name: camoufox-vnc
    restart: unless-stopped

    ports:
      - "5800:5800"      # noVNC Web UI (http://VPS_IP:5800)
      - "5900:5900"      # Direct VNC access (optional)
      - "9377:9377"      # MCP Stealth Bridge API for agents

    environment:
      - TZ=Europe/Lisbon
      - RESOLUTION_WIDTH=1366
      - RESOLUTION_HEIGHT=768
      - OS_SPOOF=windows
      - START_URL=https://duckduckgo.com
      - AUTO_UPDATE=true
      - ENABLE_CACHE=true
      # noVNC access password on the VPS (RECOMMENDED for security):
      - VNC_PASSWORD=change_this_secure_password

    volumes:
      # Permanent persistence of logins, cookies and history
      - camoufox_profile:/root/profile
      # Local folder on the VPS where downloaded files land
      - ./downloads:/data/downloads:rw

    shm_size: "2gb"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3072M

volumes:
  camoufox_profile:
    name: camoufox_profile
