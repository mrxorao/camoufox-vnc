[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_RESOLUTION_WIDTH)sx%(ENV_RESOLUTION_HEIGHT)sx24 -ac +extension GLX +render -noreset
priority=1
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:openbox]
command=openbox
environment=DISPLAY=":99"
priority=2
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

[program:x11vnc]
command=/launch-x11vnc.sh
priority=3
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 5800 localhost:5900
priority=4
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:camoufox]
command=python3 /launch-camoufox.py
environment=DISPLAY=":99",PATH="/opt/venv/bin:%(ENV_PATH)s"
priority=5
autorestart=true
stdout_logfile=/var/log/supervisor/camoufox.log
stderr_logfile=/var/log/supervisor/camoufox.err
