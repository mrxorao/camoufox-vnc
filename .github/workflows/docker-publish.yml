name: Build and Publish Docker Image

on:
  # Automatic runs on push are disabled: the image is published manually with
  #   docker build -t xorao/camoufox-vnc:latest . && docker push xorao/camoufox-vnc:latest
  # To re-enable CI publishing, add DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets
  # and restore `push: branches: [ "main" ]` below.
  workflow_dispatch:

env:
  IMAGE_NAME: xorao/camoufox-vnc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
